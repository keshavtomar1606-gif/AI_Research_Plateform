spring.application.name=AI Research Platform
# PORT is set automatically by cloud hosts such as Render.
server.port=${PORT:${SERVER_PORT:8080}}
# Trust X-Forwarded-* headers from the cloud host's proxy (correct client IP for rate limiting).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Database credentials are NOT stored here. Provide them with environment variables
# (DB_URL, DB_USERNAME, DB_PASSWORD) or in backend/config/local.properties (git-ignored).
# See backend/config/local.properties.example.
spring.config.import=optional:file:./config/local.properties,optional:file:./backend/config/local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_research_platform}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Free cloud servers are slow while starting, and the SSL handshake with a cloud database can take a while.
spring.datasource.hikari.connection-timeout=${DB_CONNECT_TIMEOUT_MS:30000}
# Small pool: plenty for a demo and gentle on free database plans (old and new versions overlap during a deploy).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Never send stack traces or internal exception messages to the browser.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# CSV uploads for the ML workflow
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# AI provider: ollama (local, default), groq (free hosted API) or openai-compatible.
app.ai.provider=${AI_PROVIDER:ollama}
# Only used when AI_PROVIDER is groq or openai-compatible. Never put the key in this file.
app.ai.base-url=${AI_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:openai/gpt-oss-20b}
# Protects the free AI quota on a public deployment.
app.ai.rate-limit-per-minute=${AI_RATE_LIMIT_PER_MINUTE:10}
app.ai.global-limit-per-minute=${AI_GLOBAL_LIMIT_PER_MINUTE:30}

# Optional shared demo password. When set, creating/editing/deleting data and using the AI
# require this value (the website asks for it once). Leave empty for local use.
app.access-key=${APP_ACCESS_KEY:}

# Local AI (Ollama). No API key is needed.
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
app.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
