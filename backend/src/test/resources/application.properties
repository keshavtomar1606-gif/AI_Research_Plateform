# Test configuration: an in-memory H2 database, so tests never touch your MySQL data.
spring.application.name=AI Research Platform (tests)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
app.ollama.base-url=http://localhost:1
app.ollama.model=llama3.2:3b
app.ollama.timeout-seconds=5
app.ai.provider=ollama
app.ai.model=test-model
app.ai.rate-limit-per-minute=100
app.ai.global-limit-per-minute=100
app.access-key=
